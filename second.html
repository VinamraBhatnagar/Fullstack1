<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(240, 248, 255);
            background-image: linear-gradient(rgba(240, 248, 255, 0.88), rgba(240, 248, 255, 0.88)), url('rem.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #333;
            padding: 12px 20px;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        .logo {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .card{
            border: 1px solid black;
            flex:1;
            padding: 3%;
            box-shadow:0px 0px 9px 0px grey;
            border-radius: 5px;
            min-width: 200px;
            margin:3% 0 0 0;
        }
        .container{
            display: flex;
            justify-content: center;
            padding: 3%;
            column-gap: 1%;
            flex-wrap: wrap;
        }
        .center-image {
            display: flex;
            justify-content: center;
            padding: 24px 3% 0 3%;
            border-style: groove;
        }
        .center-image img {
            width: min(100%, 420px);
            border-radius: 10px;
            border: 4px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        }
        .intro {
            padding: 24px 3% 0 3%;
        }
        .intro h1 {
            margin-bottom: 8px;
            color: rgb(25, 42, 86);
        }
        .intro p {
            margin-top: 0;
            max-width: 700px;
            line-height: 1.6;
            color: rgb(70, 70, 70);
        }
        .card h2 {
            color: rgb(35, 35, 35);
            margin-top: 0;
        }
        .card p {
            color: rgb(85, 85, 85);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <nav>
        <a class="logo" href="#">Tech Nova</a>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <section class="intro">
        <h1>Welcome to Tech Nova</h1>
        <p>This page now includes a simple navbar, clean text, and an RGB background color using only HTML and CSS.</p>
    </section>
    <section class="center-image">
        <img src="rem.jpg" alt="Centered decorative image">
    </section>
    <div class="container">
        <div class="card">
            <h2>card 1</h2>
            <p>first card</p>
        </div>
        <div class="card">
            <h2>card 2</h2>
            <p>second card</p>
        </div>
        <div class="card">
            <h2>card 3</h2>
            <p>third card</p>
        </div>
    </div>
</body>
</html>
