<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completion Bar</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            font-family: Arial, sans-serif;
        }

        .progress-track {
            width: min(500px, 90vw);
            height: 28px;
            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 0 0 2px #334155;
        }

        .progress-fill {
            width: 90%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ef4444, #f97316, #facc15);
        }

        .health-scale {
            width: min(560px, 92vw);
            padding: 22px;
            border-radius: 16px;
            background: #111827;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            color: #e2e8f0;
        }

        .health-scale-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .scale-ends {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="health-scale">
        <div class="health-scale-header">
            <h4>Health Scale</h4>
            <h4>90%</h4>
        </div>
        <div class="progress-track" aria-label="Health scale progress">
            <div class="progress-fill" role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="scale-ends">
            <h4>Low</h4>
            <h4>High</h4>
        </div>
    </div>
</body>
</html>
