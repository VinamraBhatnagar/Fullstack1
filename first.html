<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Cards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3>Card 1</h3>
            <p>This is the first simple card.</p>
        </div>
        <div class="card">
            <h3>Card 2</h3>
            <p>This is the second simple card.</p>
        </div>
        <div class="card">
            <h3>Card 3</h3>
            <p>This is the third simple card.</p>
        </div>
    </div>
</body>
</html>
