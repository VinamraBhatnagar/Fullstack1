<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Energy Progress</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #eef3ff;
    }

    .outer-box {
      width: 320px;
      padding: 28px 24px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(18, 41, 95, 0.14);
      text-align: center;
    }

    .title {
      margin: 0 0 20px;
      color: #0f2f70;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .progress-ring {
      --progress: 87;
      --size: 190px;
      --thickness: 16px;
      width: var(--size);
      height: var(--size);
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(
        from -90deg,
        #3ea2ff 0%,
        #0d2e82 calc(var(--progress) * 1%),
        #d9e5ff calc(var(--progress) * 1%) 100%
      );
      position: relative;
    }

    .progress-ring::before {
      content: "";
      position: absolute;
      inset: var(--thickness);
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(13, 46, 130, 0.06);
    }

    .percent {
      position: relative;
      z-index: 1;
      font-size: 38px;
      font-weight: 800;
      color: #0d2e82;
      line-height: 1;
    }

    .label {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #2f4d95;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="outer-box">
    <h2 class="title">Energy Output</h2>
    <div class="progress-ring" role="img" aria-label="Energy output is 87 percent">
      <div class="percent">87%</div>
    </div>
    <p class="label">Current Efficiency</p>
  </div>
</body>
</html>
