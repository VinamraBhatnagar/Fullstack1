<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1, .box2, .box3,.box4{
            width: 300px;
            height: 300px;
        }
        .box1{
            background: linear-gradient(rgb(4, 246, 189) , rgb(156, 25, 221))
        }
        .box2{
            background: radial-gradient(rgb(208, 114, 14) , rgb(163, 236, 4))
        }
        .box3{
            background: conic-gradient(rgb(23, 124, 187) , rgb(14, 220, 131))
        }
        .box4{
            background: linear-gradient(#e66465, #9198e5);
        }
    </style>
</head>
<body>
    <p>Linear Gradient</p>
    <div class="box1"></div>
    <p>Radial gradient</p>
    <div class="box2"></div>
    <p>Conic Gradient</p>
    <div class="box3"></div>
    <p>Conic Gradient</p>
    <div class="box4"></div>
    
</body>
</html>
