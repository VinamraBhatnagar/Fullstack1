<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Torch Sphere</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #000000;
            overflow: hidden;
        }

        .sphere {
            width: min(82vmin, 760px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(
                circle at 50% 50%,
                #ffffff 0%,
                #c8f7ff 24%,
                #5eb9ff 60%,
                #2897ff 84%,
                #1c84ef 100%
            );
            box-shadow:
                0 0 26px rgba(34, 139, 255, 0.65),
                0 0 66px rgba(34, 139, 255, 0.48);
            filter: blur(0.2px);
        }
    </style>
</head>
<body>
    <div class="sphere" aria-label="Blue glowing sphere"></div>
</body>
</html>
