<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        .container {
            display: grid;
            height: 500px;
            width: 500px;
            /*grid-template-areas: 
                "box1 box2 box2 "
                "box1 box3 box5 "
                "box4 box4 box5";*/
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,1fr);
            gap:calc(var(--size)/2);
            outline:1px solid black;
            color:white;
            border-radius: 20%;
        }
        #parent{
            display:grid;
            background-color: var(--primary-color);
            background-color:palegreen;
            grid-template-columns: subgrid;;
            grid-template-rows: subgrid;
            grid-column: 1/3;
            grid-row:1/3;
            border-radius: 30% 0 0 0;
        }
        #child{
            background-color: orange;
            grid-column:2/3;
            grid-row:2/3;
            cursor: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="parent">
            <div id="child">
                Hello
            </div>
        </div>
        
    </div>

</body>
</html>
