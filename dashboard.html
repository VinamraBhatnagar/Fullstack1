<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
        }

        .sidebar{
            width: 220px;
            height: 100vh;
            background: #333;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
        }

        .logo{
            display: block;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .sidebar ul{
            list-style: none;
        }

        .sidebar ul li{
            margin: 10px 0;
        }

        .sidebar ul li a{
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
        }

        .sidebar ul li a:hover{
            background: #555;
        }

        .main{
            margin-left: 220px;
            padding: 20px;
        }

        .nav{
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 20px;
            font-weight: bold;
        }

        .cards{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card{
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3{
            margin-bottom: 10px;
        }

        .table{
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        table th,
        table td{
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        table th{
            background: #333;
            color: white;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="#" class="logo">Dashboard</a>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>

    <div class="main">

        <div class="nav">
            Welcome Back 👋
        </div>

        <div class="cards">

            <div class="card">
                <h3>Users</h3>
                <p>1,250</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>320</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$8,500</p>
            </div>

            <div class="card">
                <h3>Products</h3>
                <p>140</p>
            </div>

        </div>

        <div class="table">

            <table>

                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>John</td>
                    <td>john@example.com</td>
                    <td>Active</td>
                </tr>

                <tr>
                    <td>Emma</td>
                    <td>emma@example.com</td>
                    <td>Pending</td>
                </tr>

                <tr>
                    <td>David</td>
                    <td>david@example.com</td>
                    <td>Inactive</td>
                </tr>

            </table>

        </div>

    </div>

</body>
</html>
