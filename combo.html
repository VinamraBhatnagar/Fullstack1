<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section h2{    /*Parent child relationship (all)*/
            color: blue;
        }
        section>h2{  /*Parent child relationship (first child )*/
            color:green;
        }
        h2~p{  /*sibling relationship(all the sibling will change to the same color*/
            color: red;
        }
        h2+p{   /*sibling relationship(first sibling after the h2)*/
            color: blueviolet;
        }

    </style>
</head>
<body>
    <section>
        <h2>Heading 1</h2>
        <p>Para 1</p>
        <p>Para 2</p>
        <div>
            <h2>Heading 2</h2>
        </div>
    </section>
</body>
</html>
